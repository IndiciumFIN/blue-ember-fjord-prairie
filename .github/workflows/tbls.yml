name: Catalog view

on:
  pull_request:
    paths:
      - 'migrations/**'
      - '.tbls.yml'
      - '.github/workflows/tbls.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.tbls.yml'
      - '.github/workflows/tbls.yml'

permissions:
  contents: read

jobs:
  tbls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: calculadoras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calculadoras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TBLS_DSN: postgres://postgres:ci-only@localhost:5432/calculadoras?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply the migrations
        run: |
          set -euo pipefail
          for file in $(ls migrations/*.sql | sort); do
            echo "$file"
            psql "$TBLS_DSN" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Install tbls 1.96.1
        run: |
          set -euo pipefail
          curl -sL -o /tmp/tbls.tar.gz https://github.com/k1LoW/tbls/releases/download/v1.96.1/tbls_v1.96.1_linux_amd64.tar.gz
          echo '18285eef0ba7d917214e8bd7dd6a22afe5fea021eed52e7149100a3d10a2af95  /tmp/tbls.tar.gz' | sha256sum -c -
          tar -C /tmp -xzf /tmp/tbls.tar.gz tbls
          sudo install -m 0755 /tmp/tbls /usr/local/bin/tbls
          tbls version
      - name: Lint the physical catalog
        run: tbls lint
      - name: Generate the view and discard it
        run: |
          set -euo pipefail
          tbls doc
          rm -rf docs/db
